name: Vigilancia de novedades

on:
  schedule:
    - cron: "30 6 * * *"   # cada día, 06:30 UTC
  workflow_dispatch:        # permite lanzarlo a mano

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: novedades
  cancel-in-progress: false

jobs:
  vigilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: monitor/requirements.txt

      - name: Instalar dependencias
        run: pip install -r monitor/requirements.txt

      - name: Buscar novedades en el BOE
        run: python monitor/run.py

      - name: Vigilar páginas de ministerios
        run: python monitor/paginas.py
        continue-on-error: true   # que un fallo de una web no impida abrir el PR del BOE

      - name: Abrir o actualizar el Pull Request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.repository.default_branch }}
          LISTA: ${{ runner.temp }}/nuevos.txt
        run: |
          NUEVAS_BASES=$(git ls-files --others --exclude-standard monitor/state/paginas)
          if [ -z "$(git status --porcelain src/content/novedades)" ] && [ -z "$NUEVAS_BASES" ]; then
            echo "Sin novedades hoy. No se abre Pull Request."
            exit 0
          fi

          # Lista de borradores nuevos, para el email (antes de hacer git add)
          git ls-files --others --exclude-standard src/content/novedades > "$LISTA"

          RAMA="novedades-automaticas"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$RAMA"
          git add src/content/novedades monitor/state
          git commit -m "Novedades detectadas $(date +%F)"
          git push --force origin "$RAMA"

          ABIERTOS=$(gh pr list --head "$RAMA" --state open --json number --jq length)
          if [ "$ABIERTOS" = "0" ]; then
            gh pr create --base "$BASE" --head "$RAMA" \
              --title "Novedades detectadas $(date +%F)" \
              --body "Borradores generados automáticamente (draft: true). Al fusionar no se publica nada: redacta el resumen de cada uno y cambia a draft: false después."
          fi

          if [ -s "$LISTA" ]; then
            echo "hay_novedades=true" >> "$GITHUB_OUTPUT"
            echo "pr_url=$(gh pr view "$RAMA" --json url --jq .url)" >> "$GITHUB_OUTPUT"
          fi

      - name: Avisar por email
        if: steps.pr.outputs.hay_novedades == 'true'
        continue-on-error: true   # un fallo del correo no debe romper el workflow
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          PR_URL: ${{ steps.pr.outputs.pr_url }}
          LISTA: ${{ runner.temp }}/nuevos.txt
        run: python monitor/avisar.py
